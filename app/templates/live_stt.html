<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jonli ovozdan matnga</title>
<style>
body{font:16px system-ui,sans-serif;background:#f6f7fc;color:#0a2937;margin:0;padding:32px}
main{max-width:780px;margin:auto;background:white;border-radius:20px;padding:30px;box-shadow:0 8px 32px #0a293712}
h1{margin-top:0}button,select{font:inherit;padding:12px 16px;border:1px solid #d8dfe5;border-radius:10px;margin:4px 8px 4px 0}
button{background:#0a2937;color:white;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}
.controls{display:flex;align-items:end;flex-wrap:wrap;gap:12px;margin-bottom:16px}.controls label{display:flex;flex-direction:column;gap:4px}.controls .check{flex-direction:row;align-items:center;padding:12px 0}
#agent-box{margin-top:22px;border-top:1px solid #e5e7eb;padding-top:12px}#agent-reply{white-space:pre-wrap;line-height:1.7}
#text{min-height:180px;white-space:pre-wrap;line-height:1.8;font-size:19px;margin-top:20px}#interim{color:#6b7280}
#status{color:#527481}small{display:block;margin-top:10px;color:#666}a{color:#527481}
@media(max-width:520px){body{padding:12px}main{padding:20px}button{margin-bottom:8px}}
</style>
</head>
<body><main>
<a href="/call">← Qo‘ng‘iroq sahifasi</a>
<h1>Jonli ovozdan matnga</h1>
<p id="status" role="status">Tayyor. Mikrofonni yoqing.</p>
<div class="controls">
<label for="language">Nutq tili<select id="language"><option value="uz">O‘zbekcha</option><option value="auto">Avtomatik (UZ / RU / EN)</option><option value="ru">Русский</option><option value="en">English</option></select></label>
<label for="silence">Gap orasidagi pauza<select id="silence"><option value="380">380 ms</option><option value="600" selected>600 ms — tabiiy</option><option value="900">900 ms</option></select></label>
<label class="check"><input id="agent-enabled" type="checkbox" checked>AI ovozli javob bersin</label>
</div>
<button id="start">Gapirishni boshlash</button><button id="stop" disabled>To‘xtatish</button><button id="copy">Matnni nusxalash</button>
<div id="text" aria-live="polite"><span id="confirmed"></span> <span id="interim"></span></div>
<small>Vaqtinchalik matn nutq davomida aniqlashtiriladi. Raqamlar va muhim ma’lumotlarni yakuniy matnda tekshiring.</small>
<section id="agent-box"><h2>AI agent</h2><p id="agent-status" role="status">Javobni kutmoqda…</p><div id="agent-reply" aria-live="polite"></div><button id="interrupt" disabled>Javobni to‘xtatish</button><audio id="agent-player" preload="auto" playsinline></audio></section>
</main>
<script src="/app/static/js/live_audio.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
let capture = null, isRunning = false, isStopping = false, sessionVersion = 0;
let confirmed = [], partial = new Map(), done = new Set();
let activeTurn = null, nextChunk = 0, playing = false, agentFinished = false, expectedChunks = 0;
let playbackFailed = false, playbackAcknowledged = false;
const playChunks = new Map(), cancelledTurns = new Set();

function render() {
    $('confirmed').textContent = confirmed.join(' ') + (confirmed.length ? ' ' : '');
    $('interim').textContent = [...partial.values()].join(' ');
}
function toggleControls(disabled) {
    $('language').disabled = disabled;
    $('silence').disabled = disabled;
    $('agent-enabled').disabled = disabled;
}
function cancelPlayback(notifyServer = false) {
    if (activeTurn) {
        cancelledTurns.add(activeTurn);
        if (cancelledTurns.size > 512) cancelledTurns.delete(cancelledTurns.values().next().value);
    }
    activeTurn = null;
    playChunks.clear();
    playing = false;
    const audio = $('agent-player');
    audio.onended = null;
    audio.onerror = null;
    audio.pause();
    audio.removeAttribute('src');
    audio.load();
    $('interrupt').disabled = true;
    if (notifyServer) capture?.send({type: 'interrupt'});
}
function showAgentListening() {
    $('interrupt').disabled = true;
    $('agent-status').textContent = isRunning ? 'Tinglayapman…' : 'To‘xtatildi.';
}
function finishAgentPlayback() {
    if (!activeTurn || !agentFinished || playing || playChunks.size) return;
    if (!playbackFailed && !playbackAcknowledged && expectedChunks > 0 && nextChunk >= expectedChunks) {
        capture?.send({type: 'agent_playback_done', turn_id: activeTurn});
        playbackAcknowledged = true;
    }
    showAgentListening();
}
async function playNext() {
    if (playing || !activeTurn || isStopping || !isRunning) return;
    if (!playChunks.has(nextChunk) && agentFinished) {
        // A failed TTS chunk must not leave playback permanently waiting for a missing index.
        const available = [...playChunks.keys()].filter(index => index >= nextChunk).sort((a, b) => a - b);
        if (available.length) {
            playbackFailed = true;
            nextChunk = available[0];
        } else {
            if (nextChunk < expectedChunks) playbackFailed = true;
            finishAgentPlayback();
            return;
        }
    }
    if (!playChunks.has(nextChunk)) return;
    const turn = activeTurn;
    const audio = $('agent-player');
    const chunk = playChunks.get(nextChunk);
    playChunks.delete(nextChunk++);
    playing = true;
    $('interrupt').disabled = false;
    $('agent-status').textContent = 'AI gapiryapti. Gapirib javobni to‘xtatishingiz mumkin.';
    audio.src = 'data:audio/mpeg;base64,' + chunk;
    const complete = () => {
        if (turn !== activeTurn) return;
        playing = false;
        playNext();
        finishAgentPlayback();
    };
    audio.onended = complete;
    audio.onerror = () => {
        if (turn !== activeTurn) return;
        playbackFailed = true;
        $('agent-status').textContent = 'Ovoz qismini ijro qilib bo‘lmadi.';
        complete();
    };
    try { await audio.play(); }
    catch (_) {
        if (turn !== activeTurn) return;
        cancelPlayback(true);
        $('agent-status').textContent = 'Ovoz ijrosi bloklandi. Brauzer ovoz ruxsatini tekshiring.';
    }
}
function onEvent(message) {
    const type = message.type;
    const id = message.item_id || 'current';
    if (type === 'input_audio_buffer.speech_started') {
        cancelPlayback();
        if (isRunning) $('agent-status').textContent = 'Sizni eshityapman…';
    } else if (type === 'transcript.partial' || type === 'conversation.item.input_audio_transcription.delta') {
        if (!done.has(id)) {
            const text = type === 'transcript.partial' ? (message.transcript || message.text || '') : (partial.get(id) || '') + (message.delta || '');
            partial.set(id, text);
            render();
        }
    } else if (type === 'conversation.item.input_audio_transcription.completed') {
        if (done.has(id)) return;
        done.add(id);
        if (done.size > 512) done.delete(done.values().next().value);
        partial.delete(id);
        const text = (message.transcript || '').trim();
        if (text) confirmed.push(text);
        render();
        // The server submits its own final transcript. No client echo/duplicate AI request.
    } else if (type === 'conversation.item.input_audio_transcription.failed') {
        partial.delete(id);
        render();
        $('status').textContent = message.message || 'Bu gapni aniqlab bo‘lmadi. Iltimos, qaytaring.';
    } else if (type === 'agent_thinking') {
        if (!isRunning || isStopping || cancelledTurns.has(message.turn_id)) return;
        cancelPlayback();
        activeTurn = message.turn_id;
        nextChunk = 0;
        agentFinished = false;
        expectedChunks = 0;
        playbackFailed = false;
        playbackAcknowledged = false;
        $('agent-reply').textContent = '';
        $('agent-status').textContent = 'AI javob tayyorlayapti…';
        $('interrupt').disabled = false;
    } else if (type === 'agent_text_delta') {
        if (message.turn_id === activeTurn) $('agent-reply').textContent += message.delta || '';
    } else if (type === 'agent_audio') {
        if (message.turn_id === activeTurn && !cancelledTurns.has(message.turn_id) && message.index >= nextChunk) {
            playChunks.set(message.index, message.audio);
            playNext();
        }
    } else if (type === 'agent_done') {
        if (message.turn_id === activeTurn) {
            agentFinished = true;
            expectedChunks = message.chunks || 0;
            playNext();
        }
    } else if (type === 'agent_cancelled' || type === 'agent_interrupted') {
        if (!message.turn_id || message.turn_id === activeTurn) { cancelPlayback(); showAgentListening(); }
    } else if (type === 'agent_error') {
        if (!message.turn_id || message.turn_id === activeTurn || (!activeTurn && !cancelledTurns.has(message.turn_id))) {
            cancelPlayback();
            $('agent-status').textContent = message.message || 'AI javobida xato.';
        }
    }
}
async function stop(message = 'To‘xtatildi. Yakuniy matn saqlandi.') {
    if (isStopping) return;
    isStopping = true;
    isRunning = false;
    $('stop').disabled = true;
    $('status').textContent = 'Oxirgi gap yakunlanmoqda…';
    cancelPlayback(true);
    const previous = capture;
    capture = null;
    const flushed = previous ? await previous.stop() : false;
    sessionVersion++;
    isStopping = false;
    toggleControls(false);
    $('start').disabled = false;
    $('status').textContent = previous?.error ? previous.error.message : (flushed ? message : 'To‘xtatildi. Oxirgi matn to‘liq kelganini tekshiring.');
    showAgentListening();
}
$('stop').onclick = () => stop();
$('interrupt').onclick = () => { cancelPlayback(true); showAgentListening(); };
$('copy').onclick = async () => {
    try { await navigator.clipboard.writeText(confirmed.join(' ')); $('status').textContent = 'Matn nusxalandi.'; }
    catch (_) { $('status').textContent = 'Nusxalashga ruxsat berilmadi. Matnni belgilang va nusxalang.'; }
};
$('agent-enabled').onchange = () => { $('agent-box').hidden = !$('agent-enabled').checked; };
$('start').onclick = async () => {
    if (isRunning || isStopping) return;
    $('start').disabled = true;
    toggleControls(true);
    partial.clear();
    done.clear();
    cancelledTurns.clear();
    render();
    $('status').textContent = 'Nutq modeli va mikrofon ulanmoqda…';
    const version = ++sessionVersion;
    const nextCapture = new LiveAudio.MicrophoneStream({
        language: $('language').value,
        silenceMs: Number($('silence').value),
        agent: $('agent-enabled').checked,
        onEvent: message => { if (version === sessionVersion) onEvent(message); },
        onError: error => {
            if (version !== sessionVersion) return;
            $('status').textContent = error.message;
            if (!isStopping) stop(error.message);
        },
    });
    capture = nextCapture;
    try {
        const ready = await nextCapture.start();
        if (version !== sessionVersion) { await nextCapture.stop(); return; }
        isRunning = true;
        $('stop').disabled = false;
        const provider = ['local', 'faster_whisper'].includes(ready.provider) ? 'Mahalliy STT' : 'OpenAI STT';
        $('status').textContent = provider + ' ulandi. Tinglayapman…';
        showAgentListening();
    } catch (error) {
        if (version !== sessionVersion) return;
        await stop(error.message);
        $('status').textContent = error.message;
    }
};
window.addEventListener('pagehide', () => capture?.release());
</script></body></html>
